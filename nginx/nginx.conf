# nginx/nginx.conf

# HTTP (80번 포트) 요청을 HTTPS로 자동 리디렉션
server {
    listen 80;
    server_name collabee.live;

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS (443번 포트) 서버 설정
server {
    listen 443 ssl;
    server_name collabee.live;

    # SSL 인증서 경로 (컨테이너 내부 경로)
    ssl_certificate /etc/letsencrypt/live/collabee.live/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/collabee.live/privkey.pem;

    # SSL 보안 설정
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    # 루트(/) 경로로 접속 시 /InsWebApp/으로 리디렉션
    location = / {
        return 302 /InsWebApp/websquare/websquare.html?w2xPath=/InsWebApp/ui/landingPage.xml;
    }

    # WebSocket 전용 경로 설정 (칸반보드용)
    location /InsWebApp/kanban {
        proxy_pass http://inswebapp:9093/InsWebApp/kanban;
        
        # WebSocket 업그레이드 헤더
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        
        # 클라이언트 정보 전달
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # WebSocket 특화 타임아웃 설정
        proxy_connect_timeout 7d;
        proxy_send_timeout 7d;
        proxy_read_timeout 7d;
        
        # 버퍼링 비활성화 (실시간 통신)
        proxy_buffering off;
    }

    # WebSocket 전용 경로 설정 (화상채팅용)
    location /InsWebApp/chat {
        proxy_pass http://inswebapp:9093/InsWebApp/chat;
        
        # WebSocket 업그레이드 헤더
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        
        # 클라이언트 정보 전달
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # WebSocket 특화 타임아웃 설정
        proxy_connect_timeout 7d;
        proxy_send_timeout 7d;
        proxy_read_timeout 7d;
        
        # 버퍼링 비활성화 (실시간 통신)
        proxy_buffering off;
    }

    # 일반 애플리케이션 경로(/InsWebApp/)에 대한 요청 처리
    location /InsWebApp/ {
        # 요청을 inswebapp 컨테이너의 9093 포트로 전달
        proxy_pass http://inswebapp:9093/InsWebApp/;

        # 클라이언트의 실제 IP와 프로토콜 정보를 백엔드에 전달
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        # 일반 HTTP 요청용 타임아웃 설정
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}
