version: "3.8"

services:
  # --- [추가] Nginx 서비스 ---
  nginx:
    image: nginx:latest
    container_name: nginx-proxy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # Nginx 설정 파일 연결
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      # EC2 서버에 발급받은 SSL 인증서 폴더 연결
      - /etc/letsencrypt:/etc/letsencrypt:ro
    networks:
      - app-network
    depends_on:
      - inswebapp

  inswebapp:
    image: fordnam1/collabee:latest
    container_name: inswebapp-container
    restart: unless-stopped
    # --- [수정] 외부 포트 노출을 제거 (Nginx가 대신 처리) ---
    # ports:
    #   - "8080:9093"
    volumes:
      - ./inswebapp/logs:/usr/local/tomcat/logs
      - ./inswebapp/volume/matrix_mobile_home:/usr/local/tomcat/volume/matrix_mobile_home
      - ./inswebapp/volume/websquare_home:/usr/local/tomcat/volume/websquare_home
      - ./inswebapp/volume/wmatrix_home:/usr/local/tomcat/volume/wmatrix_home
      - ./keys/private-key.pem:/usr/local/tomcat/keys/private-key.pem:ro
    networks:
      - app-network
    depends_on:
      redis-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9093/InsWebApp"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # ... redis-server, smee-client 서비스는 기존과 동일 ...
  redis-server:
    image: redis:7-alpine
    container_name: inswebapp-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  smee-client:
    image: node:18-alpine
    container_name: smee-client
    restart: unless-stopped
    command: ["sh", "-c", "npm install -g smee-client && smee -u https://smee.io/aYKJH3maBXQp0hDE -t http://inswebapp:9093/InsWebApp/github/webhook/legacy"]
    networks:
      - app-network
    depends_on:
      inswebapp:
        condition: service_healthy

networks:
  app-network:
    driver: bridge