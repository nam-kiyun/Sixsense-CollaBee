version: "3.8"

services:
  inswebapp:
    image: fordnam1/collabee:latest
    container_name: inswebapp-container
    restart: unless-stopped
    ports:
      - "8080:9093"
    volumes:
      # --- [수정] 아래 볼륨 경로들이 활성화되어 있는지 확인 ---
      - ./logs:/usr/local/tomcat/logs
      - ./volume/matrix_mobile_home:/usr/local/tomcat/volume/matrix_mobile_home
      - ./volume/websquare_home:/usr/local/tomcat/volume/websquare_home
      - ./volume/wmatrix_home:/usr/local/tomcat/volume/wmatrix_home
    environment:
      # .env 파일을 사용한다면 이 부분은 비워둘 수 있습니다.
      - SPRING_PROFILES_ACTIVE=prod
      - TZ=Asia/Seoul
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9093/"] # 내부 톰캣 포트와 일치
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - inswebapp-network
    depends_on:
      redis-server:
        condition: service_healthy

  redis-server:
    image: redis:7-alpine
    container_name: inswebapp-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - inswebapp-network

networks:
  inswebapp-network:
    driver: bridge